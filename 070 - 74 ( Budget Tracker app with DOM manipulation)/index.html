<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv ="X-UA-Compatible" content="ie=edge">
    <title>Personal Budget Tracker App</title>
</head>

<body>

    <h1>Personal Budget Tracker App</h1>
    <label for="userName">Name:</label>
    <input type="text" id="userName" placeholder="Enter your name">
    <br><br>
    <label for="income">Total Income:</label>
    <input type="number" id="income" placeholder="Enter your total income">
    <br><br>
    <label for="numberOfExpenses">Number of Expenses:</label>
    <input type="number" id="numberOfExpenses" placeholder="Enter the number of expenses">
    <br><br>
    <button id="startBudget">Start Budgeting</button>

    <div id="expensesInput" style="margin-top: 15px;"></div>   

    <br>

    <button id="calculateBudget" style="display: none;">Calculate Budget</button>
    <button id="resetBudget"  style="display: none;" >Reset Budget</button>
    <div class="results" id="results"></div>

    








    <script src="index.js"></script>

</body>

</html>
