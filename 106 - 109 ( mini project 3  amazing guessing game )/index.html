<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini project 3 | amazing guessing game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <div class="card">
        <div class="card-title">
            <h1>Guessing game</h1>
        </div>
        <div class="card-body">
           <form>
             <div class="form-field">
                <label for="guessingNumber">Guessa  Number between 1-5 </label>
                <input type="number" id="guessingNumber" min="1" max="5" required>
            </div>
            <div class="buttons">
                <button class="btn" type="submit" id="check">Check result</button>
            </div>
           </form>
           <p class="resultText"></p>
           <p class="remainingAttempts"></p>
        </div>
    </div>
</div>
    




    <script src="script.js"></script>
</body>
</html>
