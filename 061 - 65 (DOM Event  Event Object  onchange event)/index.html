<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <!-- type="text" example -->
    <label for="name">Name:
        <input type="text" name="name" class="nameInput" id="nameInput">
    </label>

    <!-- checkbox example -->
   <div>
        <h2>Programming Language</h2>
        <label for="js">
            <input type="checkbox" name="program" value="js" id="js"> Js
        </label>
        <label for="c">
            <input type="checkbox" name="program" value="c" id="c"> C
        </label>
        <label for="java">
            <input type="checkbox" name="program" value="java" id="java"> Java
        </label>
    </div>


         

    <!-- Select example -->
    <label for="department">Department:</label>
    <select name="department" id="department"> 
        <option value="">Select One</option>
        <option value="cse">CSE</option>
        <option value="eee">EEE</option>
        <option value="llb">LLB</option>
    </select>


    <script src="index.js"></script>
    
</body>
</html>
