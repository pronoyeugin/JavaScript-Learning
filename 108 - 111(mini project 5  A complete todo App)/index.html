<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini project 5 | A complete todo App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    
    <div class="container">
        <div class="card">
        <h1 class="card-title">Todo App</h1>
        <div class="card-body">
            <form class="todo-form">
                <input type="text" placeholder="Add a new todo..." id="todo-input" class="todo-input" required>
                <button type="submit" class="btn" id="add-todo-btn">Add Todo</button>
            </form>
            <p id="message"></p>
            <ul id="list" class="todo-list"></ul>
        </div>
        </div>

    </div>






<script src="index.js" type="module"></script>
</body>
</html>
